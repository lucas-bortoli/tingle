app = 'tingle'
primary_region = 'ewr'

[build]

[env]
AWSTA_OPENAI_CREDS_FILE = '/data/chatgpt.json'
STATUS_SERVER_HOSTNAME = '0.0.0.0'
STATUS_SERVER_PORT = '3000'

[mounts]
source = 'tingle_data'
destination = '/data'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
method = 'GET'
path = '/health'
interval = '30s'
timeout = '5s'
grace_period = '30s'

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
